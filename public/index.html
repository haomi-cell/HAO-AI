
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e0c">
  <meta name="description" content="HAO AI — teman AI untuk ide, belajar, coding, dan pekerjaan.">
  <title>HAO AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <a class="brand" href="/" aria-label="HAO AI">
          <span class="brand-logo">H</span>
          <span>HAO <b>AI</b></span>
        </a>
        <button class="icon-btn mobile-close" id="close-sidebar" type="button" aria-label="Tutup menu">×</button>
      </div>

      <button class="new-chat-btn" id="new-chat" type="button">
        <span class="plus-symbol">＋</span>
        <span>Obrolan baru</span>
      </button>

      <div class="history-heading">RIWAYAT</div>
      <div id="conversation-list" class="conversation-list"></div>

      <div class="sidebar-bottom">
        <div class="avatar-small">H</div>
        <div>
          <strong>HAO AI</strong>
          <small>AI Assistant</small>
        </div>
      </div>
    </aside>

    <button id="sidebar-overlay" aria-label="Tutup menu" type="button"></button>

    <main class="main-panel">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="open-sidebar" type="button" aria-label="Buka riwayat">☰</button>
        <div class="topbar-title">
          <span class="topbar-logo">H</span>
          <span>HAO AI</span>
        </div>
        <button class="icon-btn top-new-chat" id="header-new-chat" type="button" aria-label="Obrolan baru" title="Obrolan baru">＋</button>
      </header>

      <section id="welcome-screen" class="welcome-screen">
        <div class="welcome-orb"><span>H</span></div>
        <div class="welcome-tag">YOUR AI COMPANION</div>
        <h1>Halo, ada yang bisa<br><span>HAO bantu?</span></h1>
        <p class="welcome-subtitle">Tempat buat ide, pertanyaan, dan hal-hal yang ingin kamu selesaikan.</p>

        <div class="prompt-grid">
          <button class="prompt-card" type="button" data-prompt="Bantu aku memahami materi yang sulit dengan bahasa sederhana.">
            <span class="prompt-icon">✳</span>
            <span><strong>Belajar sesuatu</strong><small>Jelaskan dengan mudah</small></span>
            <span class="prompt-arrow">↗</span>
          </button>
          <button class="prompt-card" type="button" data-prompt="Bantu aku membuat ide kreatif untuk proyek baru.">
            <span class="prompt-icon">✧</span>
            <span><strong>Cari ide</strong><small>Mulai dari ide sederhana</small></span>
            <span class="prompt-arrow">↗</span>
          </button>
          <button class="prompt-card" type="button" data-prompt="Bantu aku menulis atau memperbaiki kode program.">
            <span class="prompt-icon">⌘</span>
            <span><strong>Bantu coding</strong><small>Tulis dan perbaiki kode</small></span>
            <span class="prompt-arrow">↗</span>
          </button>
          <button class="prompt-card" type="button" data-prompt="Bantu aku menyusun rencana kerja yang praktis dan teratur.">
            <span class="prompt-icon">◷</span>
            <span><strong>Susun rencana</strong><small>Buat langkah yang jelas</small></span>
            <span class="prompt-arrow">↗</span>
          </button>
        </div>
      </section>

      <section class="chat-area" id="chat-area" aria-label="Percakapan">
        <div class="messages" id="chat-messages" aria-live="polite"></div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="chat-form">
          <textarea id="chat-input" name="question" rows="1" maxlength="12000" placeholder="Tanya apa pun ke HAO..." aria-label="Tulis pesan" required></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <button type="button" class="tool-btn" id="attach-button" aria-label="Lampiran" title="Lampiran belum tersedia">＋</button>
              <div id="chat-tools"></div>
            </div>
            <div class="composer-actions">
              <span class="enter-hint">Enter untuk kirim · Shift+Enter untuk baris baru</span>
              <button class="send-btn" id="send-button" type="submit" aria-label="Kirim pesan" title="Kirim pesan">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </form>
        <p class="disclaimer">HAO AI bisa membuat kesalahan. Periksa kembali informasi penting.</p>
      </footer>
    </main>
  </div>
</body>
</html>
