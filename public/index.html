
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1110">
  <meta name="description" content="Smart-AI adalah asisten AI untuk membantu pertanyaan, ide, dan pekerjaanmu.">

  <title>Smart-AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>

<body>
  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/" aria-label="Smart-AI Home">
          <span class="brand-mark">S</span>
          <span>Smart-AI</span>
        </a>

        <button
          class="icon-button"
          id="close-sidebar"
          type="button"
          aria-label="Tutup sidebar"
        >×</button>
      </div>

      <button class="new-chat-button" id="new-chat" type="button">
        <span aria-hidden="true">＋</span>
        <span>Obrolan Baru</span>
      </button>

      <div class="sidebar-content">
        <div class="sidebar-section-title">RIWAYAT CHAT</div>
        <div id="conversation-list"></div>
      </div>

      <div class="sidebar-footer">
        <div class="profile-mark">S</div>
        <div class="profile-info">
          <strong>Smart-AI</strong>
          <span>AI Assistant</span>
        </div>
      </div>
    </aside>

    <div id="sidebar-overlay"></div>

    <!-- MAIN -->
    <main class="main-content" id="main-content">

      <header class="topbar">
        <button
          class="icon-button menu-button"
          id="open-sidebar"
          type="button"
          aria-label="Buka riwayat chat"
        >☰</button>

        <a class="mobile-brand" href="/">Smart-AI</a>

        <div class="topbar-actions">
          <button
            class="icon-button"
            id="header-new-chat"
            type="button"
            title="Obrolan baru"
            aria-label="Obrolan baru"
          >＋</button>
        </div>
      </header>

      <!-- WELCOME SCREEN -->
      <section class="welcome-screen" id="welcome-screen">
        <div class="welcome-content">
          <div class="welcome-symbol">S</div>

          <p class="eyebrow">YOUR PERSONAL AI ASSISTANT</p>

          <h1>Ada yang bisa <span>Smart-AI</span> bantu?</h1>

          <p class="welcome-description">
            Tanyakan apa saja, kembangkan ide, dan temukan solusi bersama AI.
          </p>

          <div class="suggestion-grid">
            <button
              class="suggestion-card"
              type="button"
              data-prompt="Bantu aku membuat strategi marketing yang efektif."
            >
              <span class="suggestion-icon">✦</span>
              <span class="suggestion-text">
                <strong>Marketing Strategy</strong>
                <small>Ide dan strategi pemasaran</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button
              class="suggestion-card"
              type="button"
              data-prompt="Bantu aku memahami dan memperbaiki kode program."
            >
              <span class="suggestion-icon">⌘</span>
              <span class="suggestion-text">
                <strong>Coding Assistant</strong>
                <small>Memahami dan membuat kode</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button
              class="suggestion-card"
              type="button"
              data-prompt="Bantu aku menyusun rencana belajar yang teratur."
            >
              <span class="suggestion-icon">◇</span>
              <span class="suggestion-text">
                <strong>Study Planner</strong>
                <small>Rencana belajar yang terarah</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>

            <button
              class="suggestion-card"
              type="button"
              data-prompt="Bantu aku menemukan ide kreatif untuk proyek baru."
            >
              <span class="suggestion-icon">✧</span>
              <span class="suggestion-text">
                <strong>Creative Ideas</strong>
                <small>Eksplorasi ide baru</small>
              </span>
              <span class="suggestion-arrow">↗</span>
            </button>
          </div>
        </div>
      </section>

      <!-- CHAT AREA -->
      <section class="chat-area" id="chat-area" aria-live="polite">
        <div class="chat-messages" id="chat-messages"></div>
      </section>

      <!-- INPUT -->
      <footer class="composer-area">
        <form class="composer" id="chat-form">
          <textarea
            id="chat-input"
            name="question"
            rows="1"
            maxlength="12000"
            placeholder="Tanya apa pun..."
            aria-label="Tulis pertanyaan"
            required
          ></textarea>

          <div class="composer-toolbar">
            <div class="composer-left">
              <button
                class="composer-icon"
                id="attach-button"
                type="button"
                title="Lampiran belum tersedia"
                aria-label="Lampiran"
              >＋</button>

              <!-- Pemilih model dibuat oleh script.js di sini -->
              <div id="chat-tools" class="input-tools"></div>
            </div>

            <div class="composer-right">
              <span class="keyboard-hint">Enter untuk mengirim</span>

              <button
                class="send-button"
                id="send-button"
                type="submit"
                aria-label="Kirim pesan"
                title="Kirim pesan"
              >
                <span aria-hidden="true">↑</span>
              </button>
            </div>
          </div>
        </form>

        <p class="composer-disclaimer">
          Smart-AI dapat membuat kesalahan. Periksa kembali informasi penting.
        </p>
      </footer>

    </main>
  </div>

  <script>
    // Penyesuaian input dan navigasi sidebar.
    document.addEventListener("DOMContentLoaded", function () {
      const input = document.getElementById("chat-input");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");

      function closeSidebar() {
        if (sidebar) sidebar.classList.remove("sidebar-open");
        if (overlay) overlay.classList.remove("sidebar-visible");
      }

      document.getElementById("open-sidebar")?.addEventListener("click", function () {
        sidebar?.classList.add("sidebar-open");
        overlay?.classList.add("sidebar-visible");
      });

      document.getElementById("close-sidebar")?.addEventListener("click", closeSidebar);
      overlay?.addEventListener("click", closeSidebar);

      document.getElementById("header-new-chat")?.addEventListener("click", function () {
        document.getElementById("new-chat")?.click();
      });

      document.querySelectorAll("[data-prompt]").forEach(function (button) {
        button.addEventListener("click", function () {
          if (!input) return;

          input.value = button.dataset.prompt || "";
          input.focus();
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
      });

      if (input) {
        const resizeInput = function () {
          input.style.height = "auto";
          input.style.height = Math.min(input.scrollHeight, 180) + "px";
        };

        input.addEventListener("input", resizeInput);
      }

      document.addEventListener("click", function (event) {
        if (event.target.closest("#conversation-list button")) {
          closeSidebar();
        }
      });
    });
  </script>
</body>
</html>
